<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1119" />
    <title>Dračí zvěsti — Online Arena</title>
    <link rel="stylesheet" href="styles.css?v=20261031-language-cards-2" />
    <script src="app.js?v=20261031-language-cards-2" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/play/">Dračí zvěsti <span>Online Arena</span></a>
      <nav aria-label="Main navigation">
        <button data-view="decks" class="nav-button active" data-i18n="decks">Decks</button>
        <button data-view="online" class="nav-button" data-i18n="onlinePlay">Online play</button>
        <a href="/" data-i18n="downloads">Downloads</a>
      </nav>
      <div class="header-status"><button id="language-toggle" class="language-toggle secondary">Čeština</button><div id="connection-pill" class="pill offline" data-i18n="offline">Offline</div></div>
    </header>

    <main>
      <section id="decks-view" class="view active" aria-labelledby="decks-title">
        <div class="section-heading">
          <div><p class="eyebrow" data-i18n="localCollection">Local collection</p><h1 id="decks-title" data-i18n="deckWorkshop">Deck workshop</h1></div>
          <div class="heading-actions"><button id="new-deck" data-i18n="newDeck">New deck</button><button id="export-decks" class="secondary" data-i18n="export">Export</button><label class="button secondary"><span data-i18n="import">Import</span><input id="import-decks" type="file" accept="application/json" hidden /></label></div>
        </div>
        <div class="workshop-grid">
          <aside class="panel deck-library"><h2 data-i18n="myDecks">My decks</h2><div id="deck-list"></div></aside>
          <section class="panel current-deck">
            <div class="deck-title-row"><input id="deck-name" maxlength="80" aria-label="Deck name" /><strong id="deck-count">0/12</strong></div>
            <p id="deck-validation" class="status-line"></p>
            <div id="deck-cards" class="deck-cards"></div>
            <button id="delete-deck" class="danger" data-i18n="deleteDeck">Delete deck</button>
          </section>
          <section class="panel catalogue">
            <div class="catalogue-tools"><input id="card-search" type="search" placeholder="Search cards" data-i18n-placeholder="searchCards" /><select id="color-filter" aria-label="Filter card color"><option value="" data-i18n="allColors">All colors</option><option>BLACK</option><option>BLUE</option><option>GREEN</option><option>RED</option></select></div>
            <div id="card-grid" class="card-grid"></div>
          </section>
        </div>
      </section>

      <section id="online-view" class="view" aria-labelledby="online-title">
        <div class="section-heading"><div><p class="eyebrow" data-i18n="humanOnly">Human opponents only</p><h1 id="online-title" data-i18n="onlineLobby">Online lobby</h1></div><div id="server-load" class="server-load">Connecting…</div></div>
        <div class="online-grid">
          <section class="panel identity-panel">
            <label><span data-i18n="playerName">Player name</span><input id="player-name" maxlength="24" value="Browser player" /></label>
            <label><span data-i18n="activeDeck">Active deck</span><select id="online-deck"></select></label>
            <button id="connect-online" data-i18n="connect">Connect</button>
            <p id="online-status" class="status-line">Choose a valid deck and connect.</p>
          </section>
          <section class="panel lobby-browser">
            <div class="panel-heading"><h2 data-i18n="openLobbies">Open lobbies</h2><button id="refresh-lobbies" class="secondary" data-i18n="refresh">Refresh</button></div>
            <div id="lobby-list" class="lobby-list"><p class="muted" data-i18n="connectLobbies">Connect to view lobbies.</p></div>
          </section>
          <section class="panel create-lobby">
            <h2 data-i18n="createLobby">Create lobby</h2>
            <label><span data-i18n="lobbyName">Lobby name</span><input id="lobby-name" maxlength="40" value="Browser lobby" /></label>
            <label><span><span data-i18n="password">Password</span> <span data-i18n="optional">(optional)</span></span><input id="lobby-password" maxlength="64" type="password" /></label>
            <button id="create-lobby" data-i18n="createLobby">Create lobby</button>
          </section>
          <section id="lobby-room" class="panel lobby-room" hidden></section>
        </div>
      </section>

      <section id="match-view" class="view match-view" aria-label="Online match">
        <div class="match-hud"><button id="leave-match" class="secondary" data-i18n="leaveMatch">Leave match</button><div id="match-status" data-i18n="waitingState">Waiting for match state…</div><div id="latency">Ping —</div></div>
        <div id="opponent-stats" class="player-stats"></div>
        <div id="dragon-panel" class="dragon-panel"></div>
        <div id="board" class="board" aria-label="Game board"></div>
        <div id="local-stats" class="player-stats"></div>
        <div id="choice-panel" class="choice-panel"></div>
        <div id="hand" class="hand" aria-label="Your hand"></div>
      </section>
    </main>

    <dialog id="card-dialog"><button id="close-card-dialog" aria-label="Close" data-i18n-aria="close">×</button><img alt="" /><div><h2></h2><p class="card-stats"></p><h3></h3><p class="ability-description"></p></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
